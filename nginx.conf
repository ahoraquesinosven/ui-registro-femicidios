server {
  listen 80;
  server_tokens off;

  root /usr/share/nginx/html;

  index index.html;

  # Security headers. Defined at the server level so they apply to every
  # response. This works only because no `location` block below sets its own
  # `add_header` — nginx does NOT inherit server-level `add_header`s into a
  # location that declares any `add_header` of its own. Keep it that way: use
  # `expires` (not `add_header Cache-Control`) for cache control in locations.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # CSP: script-src 'self' neutralizes injected inline scripts (the bundle is
  # same-origin with no inline code). style-src allows 'unsafe-inline' because
  # MUI/Emotion injects <style> tags at runtime. connect-src is intentionally
  # left open ('*') for now — outgoing requests are not yet whitelisted; tighten
  # this to the API + OAuth origins later.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src *; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  location ~* \.(?:manifest|appcache|html?|xml|json)$ {
    expires -1;
  }

  location ~* \.(?:css|js)$ {
    try_files $uri =404;
    expires 1y;
    access_log off;
  }

  # Any route containing a file extension (e.g. /devicesfile.js)
  location ~ ^.+\..+$ {
    try_files $uri =404;
  }

  # Any route that doesn't have a file extension (e.g. /devices)
  location / {
      try_files $uri $uri/ /index.html;
  }
}
