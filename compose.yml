services:
  dev:
    image: "observatorio/ui-registro-femicidios"
    build:
      context: .
      target: development
    command: npm run dev
    environment:
      - NODE_ENV=development
      - VITE_API_AQSNV_SERVER=http://localhost:8080
      - VITE_API_AQSNV_CLIENT_ID=1234
      # TanStack Router writes the route tree via write-temp-then-rename. The default
      # temp dir lives on the image overlay while ./src is a bind mount, so the rename
      # is cross-device and fails with EXDEV. Keep the temp dir on the mounted volume.
      - TSR_TMP_DIR=/app/src/.tanstack
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src/
      - ./public:/app/public/
      - ./index.html:/app/index.html
      - ./biome.json:/app/biome.json
      - ./vite.config.ts:/app/vite.config.ts
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
